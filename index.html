<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Latein-Trainer</title>
  <meta name="description" content="Vokabeln, Grammatik und Übersetzung üben – offline.">
  <meta name="theme-color" content="#8c4a5c">

  <!-- iPhone: als App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Latein">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">

  <script>
    // Dunkelmodus sofort setzen (vor dem Zeichnen), damit nichts aufblitzt.
    // Die eigentliche Einstellung liegt in IndexedDB; dies ist nur eine Kopie.
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) { /* kein Speicher verfügbar – dann eben hell */ }
  </script>
  <script src="js/version.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">Latein</h1>
    <button id="btn-settings" class="icon-btn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <!-- Hinweis, wenn eine neue Version bereitliegt -->
  <div id="update-banner" class="banner" hidden>
    <span>Neue Version verfügbar.</span>
    <button id="btn-update" class="btn btn-small">Jetzt aktualisieren</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <!-- Untere Navigation: gut mit dem Daumen erreichbar -->
  <nav class="tabbar" aria-label="Hauptmenü">
    <a href="#/start" data-tab="start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      <span>Start</span>
    </a>
    <a href="#/vokabeln" data-tab="vokabeln">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg>
      <span>Vokabeln</span>
    </a>
    <a href="#/wortschatz" data-tab="wortschatz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>Wortschatz</span>
    </a>
    <a href="#/grammatik" data-tab="grammatik">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m15 17 2 2 4-4"/></svg>
      <span>Grammatik</span>
    </a>
    <a href="#/pruefung" data-tab="pruefung">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      <span>Prüfung</span>
    </a>
  </nav>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
